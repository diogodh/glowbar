name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permissão ao Gradle
      run: chmod +x ./Glowbar/gradlew

    - name: Compilar a App
      run: cd Glowbar && ./gradlew assembleDebug

    - name: Guardar o APK
      uses: actions/upload-artifact@v4
      with:
        name: Glowbar-debug-apk
        path: Glowbar/app/build/outputs/apk/debug/*.apk
