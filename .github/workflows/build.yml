name: Build Glowbar APK

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glowbar-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Recreate release keystore
        shell: bash
        env:
          GLOWBAR_KEYSTORE_BASE64: ${{ secrets.GLOWBAR_KEYSTORE_BASE64 }}
        run: |
          echo "$GLOWBAR_KEYSTORE_BASE64" | base64 --decode > app/glowbar-release.jks
          chmod 600 app/glowbar-release.jks

      - name: Verify Gradle environment
        run: gradle --version

      - name: Lint, test and build debug APK
        env:
          GLOWBAR_KEYSTORE_PASSWORD: ${{ secrets.GLOWBAR_KEYSTORE_PASSWORD }}
          GLOWBAR_KEY_PASSWORD: ${{ secrets.GLOWBAR_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon --stacktrace
          clean lintDebug testDebugUnitTest assembleDebug

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          TAG="v${VERSION}"

          set +e
          CREATE_OUTPUT=$(gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Glowbar ${VERSION}" \
            --generate-notes 2>&1)
          CREATE_STATUS=$?
          set -e

          if [ $CREATE_STATUS -eq 0 ]; then
            echo "$CREATE_OUTPUT"
          elif echo "$CREATE_OUTPUT" | grep -q "a release with the same tag name already exists"; then
            echo "Release $TAG already exists. Updating APK asset..."
            gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            echo "$CREATE_OUTPUT"
            exit $CREATE_STATUS
          fi

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Glowbar-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
